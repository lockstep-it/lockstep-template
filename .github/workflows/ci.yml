# Trains, exports and checks on the committed invite folders (tests/fixtures)
# on the three systems candidates use. No network to Lockstep: everything a
# test needs is in this repo, plus PyPI for the Python packages.
#
# lockstep-train comes from PyPI (`lockstep-train>=1.0,<2`). Before 1.0.0 is
# published there, set the repository variable LOCKSTEP_TRAIN_SPEC to another
# pip spec, for example
#   --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple lockstep-train==1.0.0
# after LOCKSTEP-PLATFORM's release workflow has published a TestPyPI build.
#
# Not run here: `lockstep check` (tests/test_lockstep_check.py), which needs
# the released lockstep CLI and the runtime's ONNX shell, and panda-pick,
# whose robot model is too large to commit. Both run locally (TUTORIAL.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  train:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      LOCKSTEP_TRAIN_SPEC: ${{ vars.LOCKSTEP_TRAIN_SPEC || 'lockstep-train>=1.0,<2' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: CPU torch (Linux)
        # The default Linux wheel brings the CUDA stack (~2.5 GB) to a
        # runner with no GPU; the CPU index has the same version, slim.
        if: runner.os == 'Linux'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: The training stack and lockstep-train
        run: |
          pip install -r requirements.txt "pytest>=8"
          pip install $LOCKSTEP_TRAIN_SPEC
          python -c "import lockstep_train; print('lockstep-train', lockstep_train.__version__)"

      - name: Lint (what `task lint` runs)
        if: runner.os == 'Linux'
        run: |
          pip install "ruff==0.17.5"
          ruff check .
          ruff format --check .

      - name: Tests (256 PPO steps on each fixture, the export against the shell's rules, the self-check, determinism, the supervised smoke bar)
        run: python -m pytest -q

      - name: The tutorial's commands on a copy of the card-fraud folder
        run: |
          cp -R tests/fixtures/card-fraud "$RUNNER_TEMP/acme-card-fraud"
          python -m train.main --folder "$RUNNER_TEMP/acme-card-fraud" --recipe supervised
          python -m train.selfcheck --folder "$RUNNER_TEMP/acme-card-fraud"
          python -m train.evaluate --folder "$RUNNER_TEMP/acme-card-fraud" --seeds 3
