# Proves the whole pipeline on every OS researchers actually use.
#
# No environment is named here. CI asks the live platform what is published
# (`python -m train.core.discovery --first`) and builds against the first
# PUBLICLY published environment it answers with — the same discovery
# `task envs` gives a researcher. The engine-backed steps then fetch that
# release from the live CDN, so they go green with the first environments/
# deploy and never need editing when the catalog changes.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU torch (Linux)
        # The default Linux torch wheel drags the full CUDA stack (~2.5 GB)
        # onto a runner with no GPU; the cpu index has the same version slim.
        if: runner.os == 'Linux'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install the training stack
        run: |
          pip install -r requirements.txt
          pip install "lockstep-train[pettingzoo]>=0.6.0" pytest

      - name: Pick an environment from the live platform (first publicly published slug)
        # $GITHUB_ENV works under bash on every matrix OS, Windows included.
        run: |
          ENV="$(python -m train.core.discovery --first)"
          echo "ENV=$ENV" >> "$GITHUB_ENV"
          echo "building against: $ENV"

      - name: Rust toolchain (the rust scaffold + the wire reference)
        run: rustup target add wasm32-wasip2

      - name: C toolchain (wasi-sdk + wit-bindgen, as `task setup LANGS=c` installs them)
        # Runners have neither, so this exercises the real download path
        # into out/toolchains/ — the same one a user without /opt/wasi-sdk
        # hits.
        run: python -m train.toolchain install c

      - name: Wire references vs the spec goldens (Rust, then C natively where cc exists)
        run: |
          cargo test --manifest-path reference/rust-wire/Cargo.toml --quiet
          if command -v cc >/dev/null 2>&1; then
            mkdir -p out
            cc -std=c99 -Wall -Wextra -Werror -o out/test_wire reference/c-wire/test_wire.c reference/c-wire/wire.c -lm
            ./out/test_wire reference/rust-wire/tests/fixtures
          else
            echo "no native cc on this runner — the C WASM build below still proves wire.c compiles"
          fi

      - name: Hermetic tests (scaffold generation, agent.toml, discovery vs a mock CDN, stage, export) + scaffold compile tests (rust + c → wasm components)
        run: python -m pytest tests -q

      - name: create-agent from the discovered environment's live release (python)
        run: python -m train.scaffold --name ci-bot --env "$ENV"

      - name: Build the hand-written (untrained) policy through export/stage
        run: python -m train.build --agent ci-bot

      - name: Engine-backed tests (SAME_STEP autoreset semantics, parallel env)
        # The scaffold warmed the keyed cache, so these no longer skip.
        run: python -m pytest tests -q

      - name: Train through the full pipeline (tiny, vectorized, spawn workers)
        run: python -m train.main --agent ci-bot --steps 256 --num-envs 2

      - name: Self-play (PARALLEL) through the same pipeline
        # Only on a multi-seat engine: the discovered environment is the
        # platform's first public one, which may have a single seat, and
        # self-play then refuses by design.
        run: |
          ENGINE="$(find out/cache/"$ENV" -name engine.wasm | head -1)"
          SEATS="$(python -c 'import sys; from lockstep_train.env import LockstepParallelEnv as E; print(len(E(engine_source=sys.argv[1]).possible_agents))' "$ENGINE")"
          if [ "$SEATS" -lt 2 ]; then
            echo "$ENV has $SEATS seat(s): self-play does not apply; skipped"
            exit 0
          fi
          python -m train.main --agent ci-bot --steps 128 --parallel
          test -f agents/ci-bot/out/policy.pt

      - name: create-agent + build in Rust (component from the same declaration)
        run: |
          python -m train.scaffold --name ci-rust --env "$ENV" --lang rust
          python -m train.build --agent ci-rust

      - name: create-agent + build in C (wit-bindgen + wasi-sdk → component)
        run: |
          python -m train.scaffold --name ci-c --env "$ENV" --lang c
          python -m train.build --agent ci-c

      - name: Every staged bundle is a valid v2 manifest for its mode
        run: |
          python - <<'PY'
          import os
          import tomllib
          for name, kind in (("ci-bot", "onnx"), ("ci-rust", "component"), ("ci-c", "component")):
              m = tomllib.loads(open(f"agents/{name}/out/bundle/lockstep.toml", encoding="utf-8").read())
              assert m["schema_version"] == 2 and m["environment"] == os.environ["ENV"], (name, m)
              has_policy = "artifacts" in m and "policy" in m.get("artifacts", {})
              assert has_policy == (kind == "onnx"), (name, m)
              prov = m["provenance"]
              assert prov["tool"] == "lockstep-template" and prov["kind"] in ("trained", "built"), (name, prov)
              assert (prov["kind"] == "trained") == ("steps" in prov), (name, prov)
              print(f"bundle ok: {name} -> {m['environment']} [{m['mode']}] psv {m['payload_schema_version']}")
          PY
