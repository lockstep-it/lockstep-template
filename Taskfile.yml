# The template's commands. Every task uses the repo-local .venv; nothing is
# installed globally. FOLDER= is the folder `lockstep invite get` made.
# Extra flags go after `--`: task train FOLDER=~/acme-card-fraud -- --minutes 10
version: "3"

silent: true

vars:
  VENV: "{{.ROOT_DIR}}/.venv"
  PY: "{{.VENV}}/bin/python"
  NAME: '{{.NAME | default "my-policy"}}'

tasks:
  setup:
    desc: "Make .venv with the training stack and lockstep-train (LOCKSTEP_TRAIN_SPEC= for another pip spec, e.g. a wheel file)"
    cmds:
      - python3 -m venv "{{.VENV}}"
      - '"{{.PY}}" -m pip install --quiet --upgrade pip'
      - '"{{.PY}}" -m pip install --quiet -r requirements.txt'
      - '"{{.PY}}" -m pip install --quiet {{.LOCKSTEP_TRAIN_SPEC | default "\"lockstep-train>=1.0,<2\""}}'
      - 'echo "setup: ready. Next: task train FOLDER=<your invite folder>"'

  train:
    desc: "Train, export to FOLDER/NAME (default my-policy), score on practice seeds, self-check. FOLDER= [NAME=] [RECIPE=ppo|supervised] [STEPS=] [MINUTES=] [-- more flags]"
    requires:
      vars: [FOLDER]
    preconditions:
      - sh: test -x "{{.PY}}"
        msg: "no .venv yet: run task setup"
    cmds:
      - >-
        "{{.PY}}" -m train.main --folder "{{.FOLDER}}" --name "{{.NAME}}"
        {{if .RECIPE}}--recipe {{.RECIPE}}{{end}}
        {{if .STEPS}}--steps {{.STEPS}}{{end}}
        {{if .MINUTES}}--minutes {{.MINUTES}}{{end}}
        {{.CLI_ARGS}}

  evaluate:
    desc: "Score FOLDER/NAME's exported model and the no-action on practice seeds 0 to SEEDS-1 (default 10)"
    requires:
      vars: [FOLDER]
    cmds:
      - '"{{.PY}}" -m train.evaluate --folder "{{.FOLDER}}" --name "{{.NAME}}" {{if .SEEDS}}--seeds {{.SEEDS}}{{end}} {{.CLI_ARGS}}'

  selfcheck:
    desc: "Check FOLDER/NAME: the bundle, the ONNX shell's rules, and that the export plays what the network plays"
    requires:
      vars: [FOLDER]
    cmds:
      - '"{{.PY}}" -m train.selfcheck --folder "{{.FOLDER}}" --name "{{.NAME}}"'

  test:
    desc: "The template's tests on the committed invite folders (tests/fixtures). With LOCKSTEP_RUNTIME_DIR and a lockstep CLI they also run lockstep check."
    cmds:
      - '"{{.PY}}" -m pip install --quiet "pytest>=8"'
      - '"{{.PY}}" -m pytest -q'

  lint:
    desc: "ruff (lint and format check) on the template's code"
    cmds:
      - '"{{.PY}}" -m pip install --quiet "ruff==0.17.5"'
      - '"{{.PY}}" -m ruff check .'
      - '"{{.PY}}" -m ruff format --check .'
